name: 0Aureo CI

on:
  push:
    branches:
      - main
      - "bench/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 0aureo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Tests
        run: cargo test --workspace --locked

      - name: Backend check
        run: cargo check -p aureo-backend --locked

  wasm:
    name: Rust WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Frontend WASM check
        run: cargo check -p aureo-frontend --target wasm32-unknown-unknown --locked

  lean:
    name: Lean and Mathlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(tr -d '\r\n' < lean-toolchain)"
          test -n "$TOOLCHAIN"
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test -s lake-manifest.json

      - name: Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Build Lean
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      - name: Compile modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean Aureo.lean
          lake env lean Aureo/Basic.lean
          lake env lean Aureo/PipelineTest.lean

      - name: Reject unfinished proofs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' \
            --include='*.lean' \
            --exclude-dir=.lake \
            --exclude-dir=.git \
            Aureo.lean Aureo; then
            echo "ERROR: sorry/admit encontrados"
            exit 1
          fi
          echo "PASS: no sorry/admit markers"

      - name: Preserve Lean manifest
        uses: actions/upload-artifact@v4
        with:
          name: aureo-lean-manifest
          path: lake-manifest.json
          if-no-files-found: error
